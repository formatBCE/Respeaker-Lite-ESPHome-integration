# =============================================================================
# Voice satellite core — voice assistant package
#
# Wake word detection, the Home Assistant voice pipeline, the notification
# sounds, and the events that the device sends to Home Assistant.
#
# Override a *_sound_file substitution to use your own sound.
# =============================================================================

substitutions:
  # Substitutions for audio files. The built-in sounds are Ogg Opus copies of
  # the Voice PE sounds in sounds/ (CC BY 4.0, see sounds/LICENSE.md), pinned
  # with the core by satellite_core_ref.
  mute_switch_on_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/mute_switch_on.opus
  mute_switch_off_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/mute_switch_off.opus
  timer_finished_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/timer_finished.opus
  wake_word_triggered_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/wake_word_triggered.opus
  factory_reset_initiated_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/factory_reset_initiated.opus
  factory_reset_cancelled_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/factory_reset_cancelled.opus
  factory_reset_confirmed_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/factory_reset_confirmed.opus
  error_cloud_expired_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/sounds/error_cloud_expired.opus

external_components:
  # Wake word audio (esphome/esphome#21885) is not in ESPHome 2026.11. Remove
  # this block when the ESPHome release that includes it is the min_version.
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: 92723c905c72b39a60a56bfc3f110284f0a72e6c
    components:
      - api
      - micro_wake_word
      - voice_assistant

api:
  actions:
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop

switch:
  # Mute Sound Switch.
  - platform: template
    id: mute_sound
    name: Mute-unmute sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

audio_file:
  - id: factory_reset_initiated_sound
    file: ${factory_reset_initiated_sound_file}
  - id: factory_reset_cancelled_sound
    file: ${factory_reset_cancelled_sound_file}
  - id: factory_reset_confirmed_sound
    file: ${factory_reset_confirmed_sound_file}
  - id: mute_switch_on_sound
    file: ${mute_switch_on_sound_file}
  - id: mute_switch_off_sound
    file: ${mute_switch_off_sound_file}
  - id: timer_finished_sound
    file: ${timer_finished_sound_file}
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}
  - id: error_cloud_expired
    file: ${error_cloud_expired_sound_file}

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  models:
    - model: https://github.com/OHF-Voice/micro-wake-word/releases/download/okay_nabu_20241226.3/okay_nabu.json
      # probability_cutoff: 0.8
      id: okay_nabu
    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/microwakeword/models/v2/kenobi.json
      id: kenobi
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: https://github.com/OHF-Voice/micro-wake-word/releases/download/stop/stop.json
      id: stop
      internal: true
    # "Snooze": on only while a timer or the alarm rings, if "Snooze enabled" is
    # on (timers-alarm.yaml). Model trained by @dlarkinsPonderosa.
    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/microwakeword/models/v2/snooze.json
      id: snooze
      internal: true
  vad:
    probability_cutoff: 0.05
  on_wake_word_detected:
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          - script.execute:
              id: send_wake_word_event
              wake_word: !lambda return wake_word;
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          # "Snooze" stops it too, and rings again later.
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - if:
                    condition:
                      lambda: return wake_word == "Snooze";
                    then:
                      - logger.log:
                          level: INFO
                          format: "Wake word: snoozing the ringing timer"
                      - script.execute: snooze_ring
                    else:
                      - logger.log:
                          level: INFO
                          format: "Wake word ignored: stopping the ringing timer"
                      - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - logger.log:
                          level: INFO
                          format: "Wake word ignored: stopping the running voice assistant"
                      - voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - logger.log:
                                level: INFO
                                format: "Wake word ignored: stopping the announcement"
                            - media_player.stop:
                                announcement: true
                                id: external_media_player
                          # Start the voice assistant and play the wake sound, if enabled
                          else:
                            # Home Assistant verifies the wake word: light the LEDs now and play
                            # no sound, so the command can follow the wake word.
                            - if:
                                condition:
                                  lambda: return id(va).is_wake_word_audio_active();
                                then:
                                  - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
                                  - script.execute: control_leds
                                else:
                                  - if:
                                      condition:
                                        switch.is_on: wake_sound
                                      then:
                                        - script.execute:
                                            id: play_sound
                                            priority: true
                                            sound_file: "wake_word_triggered_sound"
                                        - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;
                            # Device hook, empty here. See the script below.
                            - script.execute: wake_word_start_hook
        else:
          - logger.log:
              level: INFO
              format: "Wake word ignored: microphone is muted"

select:
  - platform: template
    name: "Wake word sensitivity"
    id: wake_word_sensitivity
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      - script.execute:
          id: apply_wake_word_sensitivity
          ringing: !lambda return id(timer_ringing).state;

voice_assistant:
  id: va
  microphone:
    microphone: i2s_mics
    channels: 0
  media_player: external_media_player
  micro_wake_word: mww
  # Used only when Home Assistant asks for it: microWakeWord then proposes
  # detections at lower cutoffs and Home Assistant verifies them.
  wake_word_audio:
    buffer_duration: 1500ms
    timeout: 2s
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
    - lambda: id(init_in_progress) = false;
    # Home Assistant tells on each connection if it verifies the wake word.
    - script.execute:
        id: apply_wake_word_sensitivity
        ringing: !lambda return id(timer_ringing).state;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "error_cloud_expired"
    - if:
        condition:
          - lambda: return code == "wake-word-verification-timeout";
        then:
          - delay: 1s
          - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          - script.execute: control_leds
  # When the voice assistant starts: duck audio. A wake word that Home Assistant
  # verifies ducks audio only once it is accepted.
  on_start:
    - if:
        condition:
          lambda: return !id(va).is_wake_word_audio_active();
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20  # Number of dB quieter; higher implies more quiet, 0 implies full volume
              duration: 0.0s  # The duration of the transition (default is no transition)
  on_wake_word_detected:
    - if:
        condition:
          lambda: return id(va).is_wake_word_audio_active();
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20
              duration: 0.0s
  on_wake_word_rejected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'
  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
    
  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

interval:
  # micro_wake_word stops for good after an inference or allocation error, and
  # only on_client_connected starts it. Restart it so the device is not left deaf.
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - voice_assistant.connected:
              - lambda: return !id(init_in_progress);
              - not:
                  micro_wake_word.is_running:
          then:
            - logger.log:
                level: WARN
                format: "Wake word detection stopped, restarting it"
            - micro_wake_word.start:

script:
  # Runs after a wake word started the voice assistant. It does nothing here.
  # A device package adds actions with "- id: !extend wake_word_start_hook".
  # The XVF3800 locks its beam to the speaker direction.
  - id: wake_word_start_hook
    then: []

  # Sets the wake word cutoffs. When Home Assistant verifies the wake word,
  # microWakeWord only proposes detections, so the cutoffs are lower. A ringing
  # timer stops on any wake word without verification, so it keeps the normal
  # cutoffs. "ringing" is a parameter, because the triggers of the timer_ringing
  # switch run before the switch publishes its new state.
  - id: apply_wake_word_sensitivity
    parameters:
      ringing: bool
    then:
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      - lambda: |-
          const StringRef sensitivity = id(wake_word_sensitivity).current_option();
          if (id(va).is_wake_word_audio_active() && !ringing) {
            uint8_t cutoff = 102;                         // 0.40
            if (sensitivity == "Slightly sensitive") {
              cutoff = 128;                               // 0.50
            } else if (sensitivity == "Very sensitive") {
              cutoff = 77;                                // 0.30
            }
            id(okay_nabu).set_probability_cutoff(cutoff);
            id(hey_jarvis).set_probability_cutoff(cutoff);
            id(hey_mycroft).set_probability_cutoff(cutoff);
          } else if (sensitivity == "Slightly sensitive") {
            id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
            id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
            id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
          } else if (sensitivity == "Moderately sensitive") {
            id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
            id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
            id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
          } else if (sensitivity == "Very sensitive") {
            id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
            id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
            id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
          }

  # Script executed when we want to play sounds on the device.
  - id: play_sound
    parameters:
      priority: bool
      # sound_file: "audio::AudioFile*"
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

  # Script used activate the stop word if the TTS step is long.
  # Why is this wrapped on a script?
  #   Becasue we want to stop the sequence if the TTS step is faster than that.
  #   This allows us to prevent having the deactivation of the stop word before its own activation.
  - id: activate_stop_word_once
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
          timeout: 5s
      - delay: 1s
      # Enable stop wake word
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  - id: send_wake_word_event
    parameters:
      wake_word: string
    then:
      - homeassistant.event:
          event: esphome.wake_word_detected
          data:
            wake_word: !lambda return wake_word;
  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;
  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;
