# =============================================================================
# Voice satellite core — timers and alarm package
#
# Timers from the voice pipeline, the daily alarm, the snooze, the time zone,
# and the clock entities.
# =============================================================================

esphome:
  on_boot:
    - priority: 375
      then:
        - sensor.template.publish:
            id: next_timer
            state: -1
    - priority: -100
      then:
        - lambda: |-
            auto call = id(alarm_action).make_call();
            call.set_option(id(saved_alarm_action));
            call.perform();
        - lambda: |-
            setenv("TZ", id(saved_time_zone).c_str(), 1);
            tzset();

api:
  actions:
    - action: set_time_zone
      variables:
        posix_time_zone: string
      then:
        - lambda: |-
            setenv("TZ", posix_time_zone.c_str(), 1);
            tzset();
            id(saved_time_zone) = posix_time_zone;
            id(publish_current_time).execute();

globals:
  - id: saved_time_zone
    type: std::string
    restore_value: yes
    initial_value: '"UTC0"'
  - id: saved_alarm_action
    type: std::string
    restore_value: yes
    initial_value: '"Play sound"'
  # Global variable storing the first active timer
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: no
  # Global variable storing if a timer is active
  - id: is_timer_active
    type: bool
    restore_value: no
  # Time (epoch) at which a snoozed ring starts again, 0 = no snooze. Restored,
  # so a reboot during the snooze does not lose the alarm.
  - id: snooze_until
    type: time_t
    restore_value: yes
    initial_value: '0'

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      # Every 1 minute
      - seconds: 0
        then:
          - script.execute: check_alarm
    on_time_sync:
      - script.execute: publish_current_time

datetime:
  # schedule the alarm time from Home Assistant
  - platform: template
    icon: mdi:bell-ring
    name: "Alarm time"
    id: alarm_time
    type: time
    initial_value: "00:00:00"
    restore_value: true
    optimistic: true
    internal: false
    set_action:
      then:
        # A new alarm time abandons the snooze of the old one.
        - lambda: id(snooze_until) = 0;
        - switch.turn_on: alarm_on
          

switch:
  # Internal switch to track when a timer is ringing on the device.
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - script.stop: ring_timeout
      # Disable stop and snooze wake words
      - micro_wake_word.disable_model: stop
      - micro_wake_word.disable_model: snooze
      - script.execute: disable_repeat
      # Stop any current announcement (ie: stop the timer ring mid playback)
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            media_player.stop:
              announcement: true
              id: external_media_player
      # Set back ducking ratio to zero
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      # Refresh the LED ring
      - script.execute: control_leds
    on_turn_on:
      # Duck audio
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      # Enable stop wake word, and snooze wake word if snooze is on
      - micro_wake_word.enable_model: stop
      - if:
          condition:
            switch.is_on: snooze_enabled
          then:
            - micro_wake_word.enable_model: snooze
      # Ring timer
      - script.execute: ring_timer
      # Refresh LED
      - script.execute: control_leds
      # Stop the ring after 15 minutes. A script, not a delay here: a delay
      # would survive turn-off and cut a later ring short.
      - script.execute: ring_timeout
  # Defines if alarm is active
  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: alarm_on
    icon: mdi:bell-badge
    name: "Alarm on"
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds
  # Lets "Snooze" stop a ring and start it again after "Snooze duration".
  - platform: template
    id: snooze_enabled
    name: "Snooze enabled"
    icon: mdi:alarm-snooze
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - lambda: id(snooze_until) = 0;

number:
  # Nine minutes, as bedside clocks have done since the 1950s.
  - platform: template
    id: snooze_minutes
    name: "Snooze duration"
    icon: mdi:alarm-snooze
    optimistic: true
    restore_value: true
    initial_value: 9
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: min
    mode: box

binary_sensor:
  - platform: template
    id: snooze_pending
    name: "Snooze pending"
    icon: mdi:alarm-snooze
    lambda: return id(snooze_until) != 0;

button:
  # "Stop" is not listened for during a snooze, so a false "Stop" cannot cancel
  # a wake-up. Cancel a snooze from Home Assistant instead.
  - platform: template
    id: snooze_cancel
    name: "Cancel snooze"
    icon: mdi:alarm-off
    on_press:
      - lambda: id(snooze_until) = 0;

interval:
  # Starts the snoozed ring again. A snooze older than the 15 minute ring limit
  # (the device was off) is dropped instead of ringing late. Turning "Alarm on"
  # off cancels the snooze: this check watches the switch, because a device
  # package can replace the triggers of alarm_on (Koala does).
  - interval: 1s
    then:
      - lambda: |-
          static bool was_on = id(alarm_on).state;
          bool is_on = id(alarm_on).state;
          if (was_on && !is_on) id(snooze_until) = 0;
          was_on = is_on;
          if (id(snooze_until) == 0) return;
          auto now = id(homeassistant_time).now();
          if (!now.is_valid() || now.timestamp < id(snooze_until)) return;
          bool stale = now.timestamp - id(snooze_until) > 15 * 60;
          id(snooze_until) = 0;
          if (stale) {
            ESP_LOGW("snooze", "Snooze expired while the device was off");
            return;
          }
          id(timer_ringing).turn_on();

sensor:
  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Current device time"
    id: current_time
    icon: mdi:clock

select:
  - platform: template
    optimistic: true
    name: "Alarm action"
    id: alarm_action
    icon: mdi:bell-plus
    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"
    on_value:
      then:
        - lambda: |-
            id(saved_alarm_action) = x;

voice_assistant:
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");
  on_timer_started:
    - script.execute: control_leds
    - lambda: |
        id(next_timer).publish_state(id(first_active_timer).seconds_left);
        id(next_timer_name).publish_state(id(first_active_timer).name);
  on_timer_cancelled:
    - script.execute: control_leds
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        } else {
          id(next_timer).publish_state(-1);
          id(next_timer_name).publish_state("-");
        }
  on_timer_updated:
    - script.execute: control_leds
    - lambda: |
        id(next_timer).publish_state(id(first_active_timer).seconds_left);
        id(next_timer_name).publish_state(id(first_active_timer).name);
  on_timer_tick:
    - script.execute: control_leds
    - lambda: | 
        int seconds_left = id(first_active_timer).seconds_left;
        if (std::abs(seconds_left) % 5 == 0) {
          id(next_timer).publish_state(seconds_left); 
        }

script:
  # Stops a ring after 15 minutes. timer_ringing's on_turn_off stops this script.
  - id: ring_timeout
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: timer_ringing

  # "Snooze" while ringing: stop the ring, and ring again after snooze_minutes.
  # Needs the clock, because the deadline is a time. Without the clock the ring
  # continues, so a snooze never loses an alarm.
  - id: snooze_ring
    then:
      - if:
          condition:
            lambda: return id(homeassistant_time).now().is_valid();
          then:
            - lambda: |-
                id(snooze_until) = id(homeassistant_time).now().timestamp +
                                   (time_t) id(snooze_minutes).state * 60;
            - switch.turn_off: timer_ringing
          else:
            - logger.log:
                level: WARN
                format: "Snooze ignored: the device clock is not set"

  # Script executed when the timer is ringing, to playback sounds.
  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "timer_finished_sound"

  # Script executed when the timer is ringing, to repeat the timer finished sound.
  - id: enable_repeat_one
    then:
      # Turn on the repeat mode and pause for 500 ms between playlist items/repeats
      - media_player.repeat_one:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms

  # Script execute when the timer is done ringing, to disable repeat mode.
  - id: disable_repeat
    then:
      # Turn off the repeat mode and pause for 0 ms between playlist items/repeats
      - media_player.repeat_off:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 0ms

  # Script used to fetch the first active timer (Stored in global first_active_timer)
  - id: fetch_first_active_timer
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  # Script used to check if a timer is active (Stored in global is_timer_active)
  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(is_timer_active) = output;

  - id: check_alarm
    then:
      - lambda: |-
          id(publish_current_time).execute();
          // Check alarm
          if (id(alarm_on).state) {
            auto alarm_dt = id(alarm_time).state_as_esptime();
            auto time_now = id(homeassistant_time).now();

            if (time_now.hour == alarm_dt.hour && time_now.minute == alarm_dt.minute) {
              auto action = id(alarm_action).current_option();
              if (action == "Play sound") {
                id(timer_ringing).turn_on();
              } else if (action == "Send event") {
                id(send_alarm_event).execute();
              } else if (action == "Sound and event") {
                id(timer_ringing).turn_on();
                id(send_alarm_event).execute();
              }
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing
  - id: publish_current_time
    then:
      - lambda: |-
          // Publish current time
          auto time_now = id(homeassistant_time).now();
          id(current_time).publish_state(time_now.strftime("%H:%M"));
