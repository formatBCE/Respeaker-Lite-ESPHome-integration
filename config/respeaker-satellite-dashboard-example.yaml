substitutions:
  # Release of the satellite firmware. To update the device, set a newer release.
  # The README lists the releases and explains how to follow "main".
  respeaker_lite_ref: 2026.9.1

packages:
  respeaker-satellite: github://formatBCE/Respeaker-Lite-ESPHome-integration/config/common/respeaker-satellite-base.yaml@${respeaker_lite_ref}

esphome:
  name: respeaker-satellite
  friendly_name: respeaker-satellite

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
