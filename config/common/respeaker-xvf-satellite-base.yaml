# =============================================================================
# Respeaker XVF3800 voice satellite — all packages
#
# The factory firmware includes this file, and a device adopted in the ESPHome
# dashboard imports it at the release tag. It holds no credentials and no
# provisioning, so a remote import works without secrets.
#
# The order is important: the core comes first, so a value in the XVF3800
# packages wins. controls.yaml is left out, because the XMOS chip owns the
# buttons.
# =============================================================================

packages:
  core_base: !include ../../packages/core/base.yaml
  core_voice_assistant: !include ../../packages/core/voice-assistant.yaml
  core_media_player: !include ../../packages/core/media-player.yaml
  core_timers_alarm: !include ../../packages/core/timers-alarm.yaml
  base: !include ../../packages/xvf3800/base.yaml
  hardware: !include ../../packages/xvf3800/hardware.yaml
  voice_assistant: !include ../../packages/xvf3800/voice-assistant.yaml
  leds: !include ../../packages/xvf3800/leds.yaml
  timers_alarm: !include ../../packages/xvf3800/timers-alarm.yaml
