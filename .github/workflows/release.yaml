name: Release

# A push to main that changes esphome.project.version in packages/lite/device.yaml
# publishes that version for every device: the factory firmware and the
# manifests on GitHub Pages (one subpath per device), and one GitHub release
# with a tag. A push without a new version does nothing. Run it by hand to add a
# summary for the update entity.

on:
  push:
    branches: [main]
    paths:
      - packages/lite/device.yaml
  workflow_dispatch:
    inputs:
      summary:
        description: "Short summary that the update entity in Home Assistant shows (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REPO: formatBCE/Respeaker-ESPHome-integration
  # Each device publishes to SITE_URL/<device>. Factory devices update from the
  # manifest.json there, so never change a device's path.
  SITE_URL: https://formatbce.github.io/Respeaker-ESPHome-integration
  # Build tools. Raise them on purpose, so that a release is reproducible.
  ESPHOME_VERSION: "2026.10.0"
  EWT_GEN_VERSION: "1.6.1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and look for its release
        id: version
        run: |
          V=$(grep -E '^[[:space:]]*version:' packages/lite/device.yaml | head -n1 \
              | sed -E 's/.*version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
          test -n "$V" || { echo "::error::No esphome.project.version in packages/lite/device.yaml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" > /dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Release $V exists. Bump esphome.project.version in packages/lite/device.yaml first."
              exit 1
            fi
            echo "Release $V exists. Nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $V. Publishing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the release is consistent
        if: steps.version.outputs.release == 'true'
        run: |
          V='${{ steps.version.outputs.version }}'
          fail=0
          # check <key> <file>: the first "<key>:" line of <file> must hold the version.
          check() {
            value=$(grep -E "^[[:space:]]*$1:" "$2" | head -n1 | sed -E "s/.*$1:[[:space:]]*\"?([^\"]+)\"?[[:space:]]*\$/\\1/")
            if [ "$value" != "$V" ]; then
              echo "::error file=$2::$1 is '$value'. Set it to $V."
              fail=1
            fi
          }
          check respeaker_lite_ref packages/core/base.yaml
          for f in packages/lite/device.yaml packages/xvf3800/base.yaml packages/koala/device.yaml; do
            check version "$f"
          done
          for f in config/respeaker-satellite-dashboard-example.yaml config/respeaker-xvf-satellite-example.yaml \
                   config/koala-dashboard.yaml config/respeaker-satellite-factory.yaml \
                   config/respeaker-xvf-satellite-factory.yaml config/koala-satellite.yaml; do
            check respeaker_lite_ref "$f"
          done
          exit $fail

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One version for all devices: a failed device stops the release.
      fail-fast: true
      matrix:
        include:
          - device: lite
            factory: config/respeaker-satellite-factory.yaml
            import: config/common/respeaker-satellite-base.yaml
            title: Respeaker Lite Satellite
          - device: xvf3800
            factory: config/respeaker-xvf-satellite-factory.yaml
            import: config/common/respeaker-xvf-satellite-base.yaml
            title: Respeaker XVF3800 Satellite
          - device: koala
            factory: config/koala-satellite.yaml
            import: config/common/koala-base.yaml
            title: Koala Satellite
    env:
      V: ${{ needs.prepare.outputs.version }}
      DEVICE: ${{ matrix.device }}
      FACTORY_YAML: ${{ matrix.factory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        # ewt-gen uses the esphome on PATH, so this pins the ESPHome version.
        run: pip install uv "esphome==$ESPHOME_VERSION"

      - name: Point the build at this commit
        # The components, the XMOS firmware, the wake word models, and the
        # sounds come from this repository at respeaker_lite_ref. The tag does
        # not exist yet, so the build uses the commit SHA. The prepare job
        # checked that the committed value is the version, and --import-url
        # below still pins adopted devices to the tag.
        run: sed -i -E "s/^(  respeaker_lite_ref:).*/\1 $GITHUB_SHA/" "$FACTORY_YAML"

      - name: Build the factory and OTA firmware, and the site
        env:
          SUMMARY: ${{ inputs.summary }}
          IMPORT_FILE: ${{ matrix.import }}
          TITLE: ${{ matrix.title }}
        run: |
          uvx "ewt-gen@$EWT_GEN_VERSION" "$FACTORY_YAML" \
            --output dist \
            --publish-url "$SITE_URL/$DEVICE" \
            --fw-version "$V" \
            --import-url "github://$REPO/$IMPORT_FILE@$V" \
            --release-url "https://github.com/$REPO/releases/tag/$V" \
            --release-summary "${SUMMARY:-$TITLE $V}"
          ls -la dist/

      - name: Check the update source
        # Devices follow this URL after the update, so a wrong value strands them.
        run: |
          F="${FACTORY_YAML%.yaml}.factory.yaml"
          WANT="$SITE_URL/$DEVICE/manifest.json"
          if ! grep -qxF "    source: $WANT" "$F"; then
            echo "::error file=$F::The update source is not $WANT."
            cat "$F"
            exit 1
          fi

      - name: Check the manifest
        run: |
          python - <<'PY'
          import json, os, pathlib
          v = os.environ["V"]
          m = json.loads(pathlib.Path("dist/manifest.json").read_text())
          assert m["version"] == v, f"manifest version {m['version']} is not {v}"
          b = m["builds"][0]
          for part in b["parts"]:
              assert pathlib.Path("dist", part["path"]).is_file(), part
          assert "ota" in b, "manifest has no ota entry, so devices cannot update"
          assert pathlib.Path("dist", b["ota"]["path"]).is_file(), b["ota"]
          print(json.dumps(m, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.device }}
          path: dist/

  publish-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site

      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: artifacts/

      - name: Put each device in its subpath
        run: |
          mkdir public
          cp site/index.html public/
          for a in artifacts/site-*; do
            cp -R "$a" "public/${a#artifacts/site-}"
          done
          find public -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [prepare, build, publish-pages]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: artifacts/

      - name: Name the binaries by device
        # ewt-gen gives every device the same file names. The Pages manifests
        # use those names, so only the release copies get the device prefix.
        run: |
          mkdir assets
          for a in artifacts/site-*; do
            for f in "$a"/firmware-*.bin; do
              cp "$f" "assets/${a#artifacts/site-}-$(basename "$f")"
            done
          done
          ls -la assets/

      - name: Create the tag and the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.V }}
          body: ${{ inputs.summary }}
          generate_release_notes: true
          files: |
            assets/*.bin
